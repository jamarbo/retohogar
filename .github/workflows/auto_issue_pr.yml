name: Voice to PR Agent with Gemini (Multi-file)

on:
  issues:
    types: [opened, edited]

jobs:
  gemini-developer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-genai requests pydantic

      - name: Run Gemini AI Developer Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'EOF'
          import os
          import time
          from pydantic import BaseModel, Field
          from google import genai
          from google.genai import types

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          issue_title = os.environ['ISSUE_TITLE']
          issue_body = os.environ['ISSUE_BODY']

          print(f"Procesando requerimiento: {issue_title}")

          # Leemos app.py
          app_code = ""
          if os.path.exists("app.py"):
              with open("app.py", "r", encoding="utf-8") as f:
                  app_code = f.read()

          # Leemos index.html
          html_code = ""
          if os.path.exists("index.html"):
              with open("index.html", "r", encoding="utf-8") as f:
                  html_code = f.read()

          # Definimos el esquema estricto con Pydantic para evitar errores de parseo
          class ProjectFiles(BaseModel):
              app_py: str = Field(description="Código completo y actualizado de app.py")
              index_html: str = Field(description="Código completo y actualizado de index.html")

          prompt = f"""
          Eres un desarrollador full-stack experto en FastAPI, Python y Tailwind CSS. 
          Basado en la siguiente solicitud del usuario:
          Título: {issue_title}
          Descripción: {issue_body}

          Este es el contenido actual de app.py:
          {app_code}

          Este es el contenido actual de index.html:
          {html_code}

          Modifica ambos archivos para cumplir por completo con lo que pide el usuario.
          Devuelve el código resultante de ambos archivos cumpliendo con el esquema solicitado.
          """

          models_to_try = ['gemini-3.6-flash', 'gemini-2.5-flash', 'gemini-1.5-flash']
          max_retries = 3
          base_delay = 10  # Segundos de espera base entre reintentos
          response = None
          successful_model = None

          for model_name in models_to_try:
              print(f"\n--- Intentando con el modelo: {model_name} ---")
              success_with_model = False
              
              for attempt in range(1, max_retries + 1):
                  try:
                      print(f"Intento {attempt}/{max_retries} usando {model_name}...")
                      response = client.models.generate_content(
                          model=model_name,
                          contents=prompt,
                          config=types.GenerateContentConfig(
                              response_mime_type="application/json",
                              response_schema=ProjectFiles,
                          ),
                      )
                      print(f"¡Éxito generando contenido con {model_name}!")
                      success_with_model = True
                      successful_model = model_name
                      break
                  except Exception as e:
                      print(f"Fallo en el intento {attempt} con {model_name}: {e}")
                      if attempt < max_retries:
                          sleep_time = base_delay * attempt
                          print(f"Esperando {sleep_time} segundos antes de reintentar...")
                          time.sleep(sleep_time)
                      else:
                          print(f"Se agotaron los reintentos para {model_name}.")

              if success_with_model:
                  break
              else:
                  print(f"Cambiando al siguiente modelo disponible tras fallar con {model_name}...\n")

          if not response:
              raise Exception("Se agotaron todos los modelos y reintentos configurados sin éxito.")

          # Guardamos el modelo exitoso en una variable de entorno temporal de GitHub si se requiere o se imprime claramente
          print(f"\n✨ Proceso completado exitosamente utilizando el modelo: {successful_model}")
          with open("successful_model.txt", "w") as sm_file:
              sm_file.write(successful_model)

          # Parseamos la respuesta usando el modelo validado de Pydantic
          result = ProjectFiles.model_validate_json(response.text)

          if result.app_py:
              with open("app.py", "w", encoding="utf-8") as f:
                  f.write(result.app_py)
              print("¡app.py actualizado exitosamente por Gemini!")

          if result.index_html:
              with open("index.html", "w", encoding="utf-8") as f:
                  f.write(result.index_html)
              print("¡index.html actualizado exitosamente por Gemini!")

          EOF

      - name: Read Successful Model
        id: read_model
        run: |
          if [ -f successful_model.txt ]; then
            echo "MODEL_NAME=$(cat successful_model.txt)" >> $GITHUB_ENV
          else
            echo "MODEL_NAME=desconocido" >> $GITHUB_ENV
          fi

      - name: Open Pull Request with Gemini Changes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "feature/gemini-issue-${{ github.event.issue.number }}"
          base: "main"
          title: "Gemini AI PR: ${{ github.event.issue.title }}"
          body: |
            🤖 Este Pull Request fue implementado automáticamente por **Gemini AI** utilizando el modelo **`${{ env.MODEL_NAME }}`**, actualizando el backend y frontend según tu Issue.
            
            **Requerimiento del usuario:**
            ${{ github.event.issue.body }}
          commit-message: "feat(ai): actualización multi-archivo con modelo ${{ env.MODEL_NAME }} (issue #${{ github.event.issue.number }})"
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          signoff: false
          delete-branch: true
