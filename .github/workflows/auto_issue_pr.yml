name: Voice to PR Agent

on:
  issues:
    types: [opened, edited]

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make automatic change
        run: |
          # Modificamos un archivo para que haya un cambio real en el PR
          echo "Requerimiento de la Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" >> cambios_recientes.txt

      - name: Open Pull Request Automatically
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "feature/issue-${{ github.event.issue.number }}"
          base: "main"
          title: "Auto-PR: ${{ github.event.issue.title }}"
          body: |
            Pull request generado automáticamente desde la Issue #${{ github.event.issue.number }}.
            
            **Descripción:**
            ${{ github.event.issue.body }}
          commit-message: "feat: cambio automático por issue #${{ github.event.issue.number }}"
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          signoff: false
          delete-branch: true
