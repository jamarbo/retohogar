name: Voice to PR Agent with Gemini (Multi-file)

on:
  issues:
    types: [opened, edited]

jobs:
  gemini-developer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-genai requests

      - name: Run Gemini AI Developer Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'EOF'
          import os
          from google import genai

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          issue_title = os.environ['ISSUE_TITLE']
          issue_body = os.environ['ISSUE_BODY']

          print(f"Procesando requerimiento: {issue_title}")

          # Leemos app.py
          app_code = ""
          if os.path.exists("app.py"):
              with open("app.py", "r", encoding="utf-8") as f:
                  app_code = f.read()

          # Leemos index.html si existe
          index_html = ""
          if os.path.exists("index.html"):
              with open("index.html", "r", encoding="utf-8") as f:
                  index_html = f.read()

          prompt = f"""
          Eres un desarrollador full-stack experto en FastAPI y frontend. 
          Basado en la siguiente solicitud del usuario:
          Título: {issue_title}
          Descripción: {issue_body}

          Este es el contenido actual de app.py:
          {app_code}

          Este es el contenido actual de index.html:
          {index_html}

          Modifica los archivos que sean necesarios (app.py y/o index.html) para cumplir por completo con lo que pide el usuario.
          
          Devuelve tu respuesta EXACTAMENTE en el siguiente formato, usando etiquetas delimitadoras para separar cada archivo, sin explicaciones adicionales:

          ---APP_PY---
          [código completo y actualizado de app.py aquí]
          ---INDEX_HTML---
          [código completo y actualizado de index.html aquí]
          """

          response = client.models.generate_content(
              model='gemini-3.6-flash',
              contents=prompt,
          )

          output_text = response.text

          # Separamos los archivos usando las etiquetas
          if "---APP_PY---" in output_text and "---INDEX_HTML---" in output_text:
              parts = output_text.split("---INDEX_HTML---")
              app_part = parts[0].replace("---APP_PY---", "").strip()
              index_part = parts[1].strip()

              # Limpiamos bloques markdown si los trae
              for code_str, filename in [(app_part, "app.py"), (index_part, "index.html")]:
                  if code_str.startswith("```python"):
                      code_str = code_str[9:]
                  elif code_str.startswith("```html"):
                      code_str = code_str[7:]
                  elif code_str.startswith("```"):
                      code_str = code_str[3:]
                  if code_str.endswith("```"):
                      code_str = code_str[:-3]
                  code_str = code_str.strip()

                  if code_str:
                      with open(filename, "w", encoding="utf-8") as f:
                          f.write(code_str)
                      print(f"¡{filename} actualizado exitosamente por Gemini!")

          EOF

      - name: Open Pull Request with Gemini Changes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "feature/gemini-issue-${{ github.event.issue.number }}"
          base: "main"
          title: "Gemini AI PR: ${{ github.event.issue.title }}"
          body: |
            🤖 Este Pull Request fue implementado automáticamente por **Gemini AI** actualizando backend y/o frontend según tu Issue.
            
            **Requerimiento del usuario:**
            ${{ github.event.issue.body }}
          commit-message: "feat(ai): actualización completa de app e interfaz para issue #${{ github.event.issue.number }}"
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          signoff: false
          delete-branch: true
