name: Voice to PR Agent with Gemini (Multi-file)

on:
  issues:
    types: [opened, edited]

jobs:
  gemini-developer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-genai requests

      - name: Run Gemini AI Developer Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'EOF'
          import os
          from google import genai

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          issue_title = os.environ['ISSUE_TITLE']
          issue_body = os.environ['ISSUE_BODY']

          print(f"Procesando requerimiento: {issue_title}")

          # Leemos app.py
          app_code = ""
          if os.path.exists("app.py"):
              with open("app.py", "r", encoding="utf-8") as f:
                  app_code = f.read()

          prompt = f"""
          Eres un desarrollador backend experto en FastAPI. 
          Basado en la siguiente solicitud del usuario:
          Título: {issue_title}
          Descripción: {issue_body}

          Este es el contenido actual de app.py:
          {app_code}

          Modifica el código de app.py para cumplir por completo con lo que pide el usuario. 
          Devuelve ÚNICAMENTE el código Python completo y actualizado para app.py, sin bloques de texto markdown adicionales ni explicaciones, solo el código puro listo para guardarse.
          """

          response = client.models.generate_content(
              model='gemini-3.6-flash',
              contents=prompt,
          )

          new_code = response.text.strip()

          # Limpiamos bloques markdown si los trae
          if new_code.startswith("```python"):
              new_code = new_code[9:]
          if new_code.startswith("```"):
              new_code = new_code[3:]
          if new_code.endswith("```"):
              new_code = new_code[:-3]
          new_code = new_code.strip()

          if new_code:
              with open("app.py", "w", encoding="utf-8") as f:
                  f.write(new_code)
              print("¡app.py actualizado exitosamente por Gemini!")

          EOF

      - name: Open Pull Request with Gemini Changes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "feature/gemini-issue-${{ github.event.issue.number }}"
          base: "main"
          title: "Gemini AI PR: ${{ github.event.issue.title }}"
          body: |
            🤖 Este Pull Request fue implementado automáticamente por **Gemini AI** actualizando el backend según tu Issue.
            
            **Requerimiento del usuario:**
            ${{ github.event.issue.body }}
          commit-message: "feat(ai): actualización de app.py para issue #${{ github.event.issue.number }}"
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          signoff: false
          delete-branch: true
