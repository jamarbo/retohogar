<!DOCTYPE html>
<html lang="es" class="dark" data-theme="amber">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto del Hogar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
    <style>
        :root {
            /* Tema Claro por Defecto */
            --theme-bg: #f8fafc;
            --theme-card: #ffffff;
            --theme-cardInner: #f1f5f9;
            --theme-text: #0f172a;
            --theme-muted: #64748b;
            --theme-border: #e2e8f0;
            --theme-input-bg: #ffffff;
            --theme-tab-bg: #e2e8f0;
        }

        html.dark {
            /* Tema Oscuro */
            --theme-bg: #0f172a;
            --theme-card: #1e293b;
            --theme-cardInner: #0f172a;
            --theme-text: #f8fafc;
            --theme-muted: #94a3b8;
            --theme-border: #334155;
            --theme-input-bg: #0f172a;
            --theme-tab-bg: #334155;
        }

        /* Paletas de Acento */
        [data-theme="amber"] {
            --accent-main: #f59e0b;
            --accent-hover: #d97706;
            --accent-text: #f59e0b;
            --accent-subtext: #fbbf24;
            --accent-bg-alpha: rgba(245, 158, 11, 0.15);
            --accent-border-alpha: rgba(245, 158, 11, 0.4);
            --accent-btn-text: #0f172a;
        }

        [data-theme="emerald"] {
            --accent-main: #10b981;
            --accent-hover: #059669;
            --accent-text: #10b981;
            --accent-subtext: #34d399;
            --accent-bg-alpha: rgba(16, 185, 129, 0.15);
            --accent-border-alpha: rgba(16, 185, 129, 0.4);
            --accent-btn-text: #0f172a;
        }

        [data-theme="violet"] {
            --accent-main: #8b5cf6;
            --accent-hover: #7c3aed;
            --accent-text: #8b5cf6;
            --accent-subtext: #a78bfa;
            --accent-bg-alpha: rgba(139, 92, 246, 0.15);
            --accent-border-alpha: rgba(139, 92, 246, 0.4);
            --accent-btn-text: #ffffff;
        }

        [data-theme="ocean"] {
            --accent-main: #0284c7;
            --accent-hover: #0369a1;
            --accent-text: #0284c7;
            --accent-subtext: #38bdf8;
            --accent-bg-alpha: rgba(2, 132, 199, 0.15);
            --accent-border-alpha: rgba(2, 132, 199, 0.4);
            --accent-btn-text: #ffffff;
        }

        body {
            background-color: var(--theme-bg);
            color: var(--theme-text);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .bg-theme-card { background-color: var(--theme-card); }
        .bg-theme-cardInner { background-color: var(--theme-cardInner); }
        .bg-theme-input { background-color: var(--theme-input-bg); }
        .bg-theme-tab { background-color: var(--theme-tab-bg); }
        .border-theme { border-color: var(--theme-border); }
        .text-theme-muted { color: var(--theme-muted); }
        .text-theme-main { color: var(--theme-text); }

        .bg-accent { background-color: var(--accent-main); }
        .bg-accent-hover:hover { background-color: var(--accent-hover); }
        .text-accent { color: var(--accent-text); }
        .text-accent-subtext { color: var(--accent-subtext); }
        .text-accent-btn { color: var(--accent-btn-text); }
        .border-accent { border-color: var(--accent-main); }
        .border-accent-alpha { border-color: var(--accent-border-alpha); }
        .bg-accent-alpha { background-color: var(--accent-bg-alpha); }
    </style>
</head>
<body class=
